name: ZIP to APK Safe Convert
on:
  push:
    branches:
      - main

jobs:
  convert_to_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Automatically Find and Unzip
        run: |
          mkdir ./web_files
          unzip -o *.zip -d ./web_files
          # If files are nested inside a subfolder, move them to root
          if [ $(ls -1 ./web_files | wc -l) -eq 1 ] && [ -d ./web_files/* ]; then
            mv ./web_files/*/* ./web_files/ || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "My App" "com.my-learning-platform.app" --web-dir=./web_files --confirm
          npx cap add android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build Final APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: finished-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
